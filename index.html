<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tea-House-Project</title>
    <!-- css file link -->
    <link rel="stylesheet" href="styles/style.css" />
    <!-- Tailwind css and Daisy Ui CDN link -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
      integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- favicon -->
    <link rel="shortcut icon" href="./images/banner.png" type="image/x-icon" />
  </head>
  <body>
    <!-- Header Part -->
    <header class="header-container container mx-auto mt-10 flex flex-col md:flex-row gap-10 justify-between">
      <div class="header-left-div">
        <h1 class="text-[80px]">It's good <br> tea time at The Tea House</h1>
        <p class="text-lg mb-5 text-[#777]">
          Tea and Botanical Solutions Supplier Give Optimum <br> Satisfaction To Your
          Taste Buds.
        </p>
        <button class="w-[200px] text-[white] h-[64px] rounded-xl bg-gradient-to-r from-[#FF8938] to-[#F00]">Explore More <i class="fa-solid fa-arrow-right -rotate-[35deg]"></i></button>
      </div>

      <div class="header-right-div mt-20 w-[100%] relative">
        <img src="./images/banner.png" alt="">

        <div class=" w-[255px] h-[100px] badge flex gap-5 absolute bottom-8 left-28">
            <div>
                <i class="fa-solid fa-star"></i>
            </div>
            <div>
                <h5>5.00</h5>
                <p>Trust Pilot Ratings</p>
            </div>
        </div>
      </div>
    </header>
    <!-- Main Part -->
    <main></main>
    <!-- Footer Part -->
    <footer></footer>
  </body>
</html>
